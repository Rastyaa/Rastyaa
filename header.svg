<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="33%" stop-color="#C74BF7"/>
      <stop offset="66%" stop-color="#4A47F5"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <radialGradient id="blobGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C74BF7" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#4A47F5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4A47F5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="meteorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="shimmerGradient" x1="-20%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-20%;120%" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;140%" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" result="blur">
        <animate attributeName="stdDeviation" values="6;12;6" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="#0a0e1a"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <!-- soft breathing gradient blob behind title -->
  <circle cx="600" cy="150" r="230" fill="url(#blobGradient)">
    <animate attributeName="r" values="210;250;210" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- meteors -->
  <g opacity="0.9">
    <line x1="0" y1="0" x2="90" y2="90" stroke="url(#meteorGradient)" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="-100,-40; 1300,540" dur="5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="5s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="70" y2="70" stroke="url(#meteorGradient)" stroke-width="1.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="-80,-60; 1320,460" dur="6.5s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="6.5s" begin="2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="100" y2="100" stroke="url(#meteorGradient)" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="-120,-20; 1280,560" dur="7.5s" begin="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="7.5s" begin="4.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="60" y2="60" stroke="url(#meteorGradient)" stroke-width="1.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="-60,-70; 1340,420" dur="5.8s" begin="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="5.8s" begin="7s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- twinkling particles -->
  <g fill="#ffffff">
    <circle cx="80"  cy="60"  r="1.6"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0s"   repeatCount="indefinite"/></circle>
    <circle cx="150" cy="220" r="1.3"><animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="90"  r="1.8" fill="#38BDF8"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1s"   repeatCount="indefinite"/></circle>
    <circle cx="310" cy="260" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="60"  cy="180" r="1.2" fill="#C74BF7"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="70"  r="1.6"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="230" r="1.4" fill="#FF6B6B"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="970"  cy="100" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="890"  cy="250" r="1.3" fill="#38BDF8"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="170" r="1.2"><animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="40"  r="1.3"><animate attributeName="opacity" values="0;1;0" dur="2.7s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="55"  r="1.5" fill="#C74BF7"><animate attributeName="opacity" values="0;1;0" dur="3.3s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="280" r="1.1"><animate attributeName="opacity" values="0;1;0" dur="2.3s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="290" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="3.0s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orbiting accent dot -->
  <circle r="4" fill="#38BDF8">
    <animateMotion dur="6s" repeatCount="indefinite"
      path="M 600,150 m -260,0 a 260,70 0 1,0 520,0 a 260,70 0 1,0 -520,0"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- title -->
  <text x="600" y="172" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif"
        font-size="84" font-weight="800" letter-spacing="4" fill="url(#titleGradient)" filter="url(#glow)">
    RENDRASTYA
  </text>

  <!-- subtitle -->
  <text x="600" y="220" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif"
        font-size="21" fill="#C9D1D9" opacity="0">
    ✦ Fullstack Developer · Guestlist.id · Bali 🌴 ✦
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3;1" dur="1.8s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- shimmer underline -->
  <rect x="450" y="248" width="300" height="3" rx="1.5" fill="#2a3040"/>
  <rect x="450" y="248" width="300" height="3" rx="1.5" fill="url(#shimmerGradient)"/>
</svg>
